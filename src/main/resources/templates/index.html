<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ZenVault | Secure Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px; background: white; max-width: 500px; width: 100%; }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #34495e; }
    </style>
</head>
<body>

<div class="hero-section">
    <div class="main-card text-center">
        <h1 class="display-5 fw-bold mb-3" style="color: #2c3e50;">ZenVault</h1>
        <p class="text-muted mb-4">Secure. Simple. Reliable Banking.</p>

        <div th:if="${success}" class="alert alert-success mt-3" role="alert">
            <span th:text="${success}"></span>
        </div>

        <div class="d-grid gap-3">
            <a href="login" class="btn btn-primary btn-lg">Login to Account</a>
            <a href="register" class="btn btn-outline-secondary">Create New Account</a>
        </div>
    </div>
</div>

</body>
</html>
